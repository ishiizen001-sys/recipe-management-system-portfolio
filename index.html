<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Cost Studio</title><link rel="stylesheet" href="styles.css"></head><body><aside><div class="logo"><b>R</b><span>Recipe<br><small>Cost Studio</small></span></div><nav><button data-view="dashboard" class="active">ダッシュボード</button><button data-view="recipes">レシピ管理</button><button data-view="ingredients">食材マスタ</button></nav><p class="aside-note">PORTFOLIO DEMO<br>架空データ・画面内操作</p></aside><main><header><div><p class="eyebrow">RECIPE OPERATIONS</p><h1 id="pageTitle">レシピ原価ダッシュボード</h1><p id="pageLead">原価と収益性をひと目で確認できます。</p></div><div class="avatar">DEMO</div></header><div id="app"></div><footer>名称・価格・分量はすべて架空です。変更は外部へ送信されません。</footer></main><dialog id="editor"><form id="recipeForm"><div class="modal-head"><div><p class="eyebrow">RECIPE EDITOR</p><h2 id="modalTitle">レシピを作成</h2></div><button type="button" id="closeModal" class="icon-btn">×</button></div><div class="form-grid"><label>料理名<input name="recipeName" required></label><label>カテゴリ<select name="cat"><option>メイン</option><option>サイド</option><option>デザート</option></select></label><label>参考売価<input name="price" type="number" min="1" required></label><label>アイコン<select name="icon"><option>🍽️</option><option>🍗</option><option>🍝</option><option>🥗</option><option>🥧</option><option>🍰</option></select></label></div><h3>使用食材</h3><div id="recipeLines"></div><button type="button" id="addLine" class="sub-btn">＋ 食材を追加</button><div class="estimate"><span>自動計算された1食原価</span><strong id="estimatedCost">¥0</strong></div><div class="form-actions"><button type="button" id="cancelModal" class="sub-btn">キャンセル</button><button class="primary">レシピを保存</button></div></form></dialog><script src="app.js"></script></body></html>
